{% extends "base.html" %}
{% block title %}Add Item - MediaList{% endblock %}
{% block content %}
<div class="section">
  <div class="section-head"><h1>Add item manually</h1><a class="more" href="/admin">← Admin</a></div>

  {% if saved %}
    <p class="saved-note">Saved. <a href="/item/{{ saved }}">View item →</a></p>
  {% endif %}

  <form class="admin-form" method="post" action="/admin/add">
    <label>Type
      <select name="type_">
        {% for key, cat in categories.items() %}
          <option value="{{ key }}">{{ cat.label }}{% if cat.adult %} (18+){% endif %}</option>
        {% endfor %}
      </select>
    </label>
    <label>Title<input name="title" required></label>
    <label>Cover image URL<input name="image_url" placeholder="https://..."></label>
    <label>Description<textarea name="synopsis" rows="4"></textarea></label>
    <div class="form-row">
      <label>Year<input name="year" placeholder="2024"></label>
      <label>Season<input name="season" placeholder="Fall 2024"></label>
      <label>Status
        <select name="air_status">
          <option value="finished">Finished</option>
          <option value="airing">Airing / Ongoing</option>
          <option value="upcoming">Upcoming</option>
        </select>
      </label>
    </div>
    <div class="form-row">
      <label>Total eps/ch/min<input name="units_total" placeholder="12"></label>
      <label>Score (0-10)<input name="score" placeholder="8.5"></label>
      <label class="check"><input type="checkbox" name="is_adult" value="1"> Mark 18+ (age-gated)</label>
    </div>
    <div class="form-row">
      <label>Where to watch - names (one per line)<textarea name="watch_names" rows="3" placeholder="Netflix&#10;Crunchyroll"></textarea></label>
      <label>Where to watch - URLs (one per line)<textarea name="watch_urls" rows="3" placeholder="https://netflix.com&#10;https://crunchyroll.com"></textarea></label>
    </div>
    <label>Embed URL (official iframe src - plays inline)
      <input name="embed_url" placeholder="https://www.pornhub.com/embed/ph123  or  https://www.youtube.com/embed/abc">
    </label>
    <button class="btn-primary">Save item</button>
  </form>
  <p class="muted">Adult types are auto-marked 18+ even if you leave the box unchecked.</p>
</div>
{% endblock %}
